; pytest 配置。
;
; 为什么用 pytest.ini 而不是往 pyproject.toml 里塞 [tool.pytest.ini_options]：
; 本包是"整目录覆盖"的落地方式（cp -r overlay/. .），如果包里带一份只有
; pytest 配置的 pyproject.toml，覆盖时会直接冲掉项目原有的 [project] /
; [build-system] 等元数据——备份提醒挡不住手快。改用 pytest.ini 后，这个包
; 对既有文件是**纯新增**，误操作的代价从"丢构建配置"降到"多一个文件"。
;
; pytest 只会采用优先级最高的一份配置文件，pytest.ini 优先级高于 pyproject.toml。
; 如果你的 pyproject.toml 里本来就有 pytest 配置，请把它合并到这里，或者改用
; docs/pyproject.qa-snippet.toml 手工并入 pyproject.toml 后删除本文件。

[pytest]
; tests      : 原有的单元测试（业务内部逻辑）+ 新增的配置层守护用例
; tests_api  : 接口自动化测试（通过 HTTP 契约验证业务）
testpaths = tests tests_api

norecursedirs =
    gpt-researcher
    MetaGPT
    desktop-shadertoy
    .venv
    data
    logs
    .git
    reports

pythonpath = .

addopts =
    -ra
    --strict-markers
    --durations=10

; -ra              结果摘要里列出所有非通过用例及原因
; --strict-markers 用了未注册的 marker 直接报错，避免拼写错导致整批用例静默漏跑
; --durations=10   打印最慢的 10 条，持续盯住耗时劣化

markers =
    smoke: 冒烟，每次提交必跑
    api: 接口功能用例
    contract: 响应契约（JSON Schema）用例
    config: 配置层守护用例（凭据可选性、环境变量隔离、配置报错可读性）
    fault: 异常与故障注入用例
    e2e: 端到端业务流
    image: 需要图像层校验
    slow: 耗时较长
    gpu: 需要真实 OpenGL 环境
    live: 打真实大模型，需要 API Key

asyncio_mode = auto
